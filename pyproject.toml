[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "folder-to-epub"
version = "2.1.0"
description = "Convert an image folder tree or chapter subdirectories into a clean, structured EPUB 3 eBook."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Amadou SY" }
]
dependencies = [
    "customtkinter>=5.2.0",
    "Pillow>=10.0.0",
    "EbookLib>=0.18",
    "natsort>=8.4.0",
    "rich>=13.0.0",
]

[project.scripts]
folder-to-epub = "folder_to_epub.cli.main:main"
folder-to-epub-gui = "folder_to_epub.ui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["folder_to_epub*"]
